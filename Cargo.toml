[workspace]
resolver = "2"
members = [
    "crates/pomone-domain",
    "crates/pomone-db",
    "crates/pomone-app",
    "crates/pomone-ui",
    "crates/pomone-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Pomone contributors"]
repository = "https://github.com/guycorbaz/pomone"
rust-version = "1.80"

[workspace.dependencies]
# Domain types
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rust_decimal = { version = "1.36", default-features = false, features = ["serde", "std"] }
rust_decimal_macros = "1.36"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Async runtime + DB
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "mysql", "chrono", "uuid", "rust_decimal", "migrate", "macros"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# i18n
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = { version = "0.9", features = ["macros"] }

# UI — software renderer is pure-Rust (no fontconfig/skia system deps).
# Switch features to renderer-femtovg or renderer-skia for higher fidelity
# once the platform's dev libraries are available.
slint = { version = "1.8", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
slint-build = "1.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
toml = "0.8"
directories = "5"

# Tests
proptest = "1"
rstest = "0.23"
insta = "1"
pretty_assertions = "1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["mariadb"] }
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
# `deny` rather than `forbid` so generated code (Slint, sqlx) can opt out
# locally with `#[allow(unsafe_code)]`. We don't write unsafe directly.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic exceptions to pedantic
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
# Domain constructors regularly take many fields by name
too_many_arguments = "allow"
# Date-typed fields share an `_on` suffix on purpose
struct_field_names = "allow"
# Snake_case field names appear regularly in doc comments — too noisy
doc_markdown = "allow"
# Internal converters routinely take `Row` by value; perf is negligible
needless_pass_by_value = "allow"
# Short variable names (m, d, s) are fine in tightly-scoped helpers
many_single_char_names = "allow"
