[package]
name = "pomone-ui"
description = "Pomone desktop UI (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "pomone"
path = "src/main.rs"

[dependencies]
pomone-domain = { path = "../pomone-domain" }
pomone-db = { path = "../pomone-db" }
pomone-app = { path = "../pomone-app" }
slint.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
fluent.workspace = true
# Cross-platform "open this file/URL with the system default" (xdg-open /
# `open` / `cmd /c start`). Used to launch the bundled user manual PDF.
open = "5"

[build-dependencies]
slint-build.workspace = true

# cargo-packager config — see https://github.com/crabnebula-dev/cargo-packager
# Produces .deb + AppImage on Linux from the `pomone` binary.
[package.metadata.packager]
product-name = "Pomone"
identifier = "io.github.guycorbaz.pomone"
description = "Pomone desktop UI (Slint)"
long-description = "Pomone is a planning application for market gardening, field crops, orcharding and agroforestry: plantings, locations, cultures, harvests, and a monthly calendar."
homepage = "https://github.com/guycorbaz/pomone"
authors = ["Pomone contributors"]
license-file = "../../LICENSE"
category = "Utility"
icons = [
    "assets/icons/pomone-32.png",
    "assets/icons/pomone-64.png",
    "assets/icons/pomone-128.png",
    "assets/icons/pomone-256.png",
    "assets/icons/pomone-512.png",
]
formats = ["deb", "appimage"]
# Build the user manual PDF (xelatex) before packaging, so it can be bundled.
# cargo-packager runs hooks from the directory containing this Cargo.toml
# (`crates/pomone-ui/`), so we use `dir` to switch into the docs/manual
# folder at the workspace root. latexmk is idempotent: it skips when
# nothing has changed.
before-packaging-command = { script = "latexmk -xelatex -interaction=nonstopmode manuel.tex", dir = "../../docs/manual" }

[package.metadata.packager.deb]
section = "misc"
priority = "optional"
# Runtime dependencies. fontconfig + freetype are dynamically linked by Slint's
# winit backend (font resolution). libxkbcommon is dlopened for keyboard input
# on both X11 and Wayland. The `|` alternation handles Ubuntu 24.04's
# time_t-renamed libfontconfig1t64.
depends = [
    "libfontconfig1 | libfontconfig1t64",
    "libfreetype6",
    "libxkbcommon0",
]

# Bundle the user manual at the standard Debian path. Lets the app's
# Help → Open manual button find it deterministically.
[package.metadata.packager.deb.files]
"../../docs/manual/manuel.pdf" = "usr/share/doc/pomone/manuel.pdf"

# AppImage: install the manual under the AppImage's usr/share/doc tree so
# the app can resolve $APPDIR/usr/share/doc/pomone/manuel.pdf at runtime.
[package.metadata.packager.appimage.files]
"../../docs/manual/manuel.pdf" = "usr/share/doc/pomone/manuel.pdf"
