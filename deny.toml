[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # tokio-tar 0.3.1 is unmaintained and has a PAX header parsing flaw
    # (CVE-2025-62518). It only enters our build through testcontainers
    # 0.23.3 → testcontainers-modules, both dev-dependencies used to
    # spin up the MariaDB integration container. We don't read untrusted
    # tar archives at runtime. To be revisited if testcontainers ships a
    # release that switches to astral-tokio-tar.
    "RUSTSEC-2025-0111",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "OpenSSL",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path-only deps inside the workspace appear as wildcards; that's normal
# and not what `wildcards = "deny"` is meant to catch.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
