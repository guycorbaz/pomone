name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Slint native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Linux-only for now: development targets Linux in this phase, so the
  # macOS/Windows matrix legs were dropped (faster PRs, no cross-OS runners).
  # Kept as a single-entry matrix so the status-check context stays
  # "test (ubuntu-latest)". Re-add other OSes here (and to the branch
  # protection required checks) when cross-platform support resumes.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Slint native build dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  coverage:
    name: coverage (≥80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Slint native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage
        # UI/CLI entry points are thin Slint↔Rust glue and `clap` plumbing —
        # the binary `main.rs` files can't be exercised headlessly, so we
        # exclude them from the line-coverage gate. The MariaDB backend
        # stays counted at 0% because its tests live behind `#[ignore]`
        # (need a running MariaDB container); the headline number still
        # has to clear 80% across everything else.
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex '(pomone-(ui|cli)/src/main\.rs|crates/pomone-(ui|cli)/src/main\.rs)' \
            --fail-under-lines 80
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
